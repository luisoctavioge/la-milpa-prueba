<title>La Milpa</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A120C">
<!-- para instalarlo en la pantalla de inicio (la página publicada; en el Artifact no hace nada) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Milpa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@500;600&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* La Milpa · prototipo jugable para el teléfono. Una sola pantalla: el mundo de píxel (milpa-render.js) llena todo y la
   interfaz va encima, en placas con íconos y números en puntos y barras. El ciclo lo lleva el motor (motor.js). */
:root{
  --fondo:#0A120C; --placa:rgba(255,255,255,.93); --solida:#FFFFFF; --tinta:#18201A; --suave:#5E6A5C; --acento:#2F7A3A;
  --sombra:rgba(0,0,0,.18); --linea:rgba(94,106,92,.35); --aviso:#FFCE40;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fondo:#0A120C}}
:root[data-theme="dark"]{--fondo:#0A120C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fondo);overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;font:500 15px/1.4 var(--body)}
#app{--u:1.3px;position:relative;overflow:hidden;width:100%;height:100%;max-width:calc(100vh * .62);max-width:calc(100dvh * .62);
  background:var(--fondo);color:var(--tinta)}
#mundo{position:absolute;inset:0;width:100%;height:100%}
#marcas,#ui{position:absolute;inset:0;pointer-events:none}
#marcas{transition:opacity .25s}
.capa{position:absolute;inset:0;pointer-events:none}
.capa button,.capa .t{pointer-events:auto}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--aviso);outline-offset:2px}
button:disabled{cursor:default}

/* placas, íconos y números */
.placa{background:var(--placa);color:var(--tinta);border-radius:calc(var(--u)*22);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*8);
  box-shadow:0 calc(var(--u)*2) 0 var(--sombra),0 calc(var(--u)*10) calc(var(--u)*22) calc(var(--u)*-12) rgba(0,0,0,.45)}
.arriba{position:absolute;top:calc(env(safe-area-inset-top,0px) + var(--u)*16)}
.abajo{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*26)}
.izq{left:calc(var(--u)*14)} .der{right:calc(var(--u)*14)}
.centro{left:0;right:0;margin-inline:auto;width:max-content}
.redonda{width:calc(var(--u)*44);height:calc(var(--u)*44);border-radius:50%}
.pildora{height:calc(var(--u)*44);padding:0 calc(var(--u)*14);border-radius:calc(var(--u)*22)}
.ico{width:calc(var(--u)*24);height:calc(var(--u)*24);flex:none;display:block;overflow:visible}
.ico.m{width:calc(var(--u)*30);height:calc(var(--u)*30)} .ico.g{width:calc(var(--u)*38);height:calc(var(--u)*38)}
.acc{color:var(--acento)} .sua{color:var(--suave)}
.maya{display:block;flex:none;overflow:visible}
.accion{height:calc(var(--u)*62);min-width:calc(var(--u)*132);padding:0 calc(var(--u)*24);border-radius:calc(var(--u)*31);gap:calc(var(--u)*12)}
.accion.chica{min-width:0;width:calc(var(--u)*52);height:calc(var(--u)*52);padding:0;border-radius:50%}
.fila-acc{display:flex;gap:calc(var(--u)*12);align-items:center}
.llama{animation:llama 1.7s ease-in-out infinite}
@keyframes llama{0%,100%{box-shadow:0 calc(var(--u)*2) 0 var(--sombra),0 0 0 0 rgba(255,206,64,0)}50%{box-shadow:0 calc(var(--u)*2) 0 var(--sombra),0 0 0 calc(var(--u)*9) rgba(255,206,64,.6)}}
.franjas{display:flex;gap:calc(var(--u)*3);align-items:flex-end}
.franjas i{width:calc(var(--u)*6);height:calc(var(--u)*16);border:calc(var(--u)*1.6) solid currentColor}
.franjas i.on{background:currentColor}
.puntos{display:flex;gap:calc(var(--u)*3)}
.puntos i{width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;border:calc(var(--u)*1.5) solid currentColor}
.puntos i.on{background:currentColor}
.barra-av{width:calc(var(--u)*64);height:calc(var(--u)*8);border-radius:99px;background:rgba(127,127,127,.28);overflow:hidden;flex:none}
.barra-av i{display:block;height:100%;background:var(--acento);border-radius:99px}
.sep{width:calc(var(--u)*1.4);height:calc(var(--u)*22);background:var(--linea);flex:none}
/* textos */
[hidden]{display:none!important}
.tit{font:800 calc(var(--u)*15)/1.15 var(--display);letter-spacing:.005em;white-space:nowrap}
.tit.grande{font-size:calc(var(--u)*20);white-space:normal;text-align:center;text-wrap:balance}
.txt{font:600 calc(var(--u)*13)/1.3 var(--body)}
.sub{font:500 calc(var(--u)*12)/1.35 var(--body);color:var(--suave)}
.nota{margin:0 0 calc(var(--u)*16);font:500 calc(var(--u)*13)/1.45 var(--body);color:var(--suave);text-wrap:pretty}
.dicho{position:absolute;left:0;right:0;margin-inline:auto;display:block;width:calc(100% - var(--u)*32);max-width:calc(var(--u)*280);padding:calc(var(--u)*10) calc(var(--u)*16);
  border-radius:calc(var(--u)*18);font:500 calc(var(--u)*13.5)/1.4 var(--body);text-align:center;text-wrap:balance}
.dicho.alto{top:calc(env(safe-area-inset-top,0px) + var(--u)*70)}
.dicho.bajo{bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*100)}
.monte .dicho.alto{top:calc(env(safe-area-inset-top,0px) + var(--u)*70)}
.estado{flex-direction:column;height:auto;padding:calc(var(--u)*8) calc(var(--u)*16);border-radius:calc(var(--u)*20);gap:calc(var(--u)*4);max-width:calc(100% - var(--u)*28)}
.estado .l1{display:flex;align-items:center;gap:calc(var(--u)*7)}
.estado .l2{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*4) calc(var(--u)*12)}
.estado .sub{text-align:center}
.chip{display:flex;align-items:center;gap:calc(var(--u)*5);font:600 calc(var(--u)*12)/1 var(--body);color:var(--suave);white-space:nowrap}
.accion.secundaria{height:calc(var(--u)*48);min-width:0;padding:0 calc(var(--u)*16);gap:calc(var(--u)*6)}
.cab-troje{left:calc(var(--u)*64);right:calc(var(--u)*56);max-width:calc(100% - var(--u)*120)}
.hoja-tit{text-align:center;margin:calc(var(--u)*-4) 0 calc(var(--u)*14)}
.s-tit{display:flex;align-items:center;gap:calc(var(--u)*8)}
.fila-t{display:flex;flex-direction:column;gap:calc(var(--u)*3);flex:1;min-width:0;text-align:left}
.fila-s .fila-t .barra-av{flex:none;width:100%;height:calc(var(--u)*8);margin-top:calc(var(--u)*4)}
.cuenta-c{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2);margin:calc(var(--u)*4) 0 calc(var(--u)*14)}
.cuenta-c .num{font:900 calc(var(--u)*44)/1 var(--display);font-variant-numeric:tabular-nums}
.sem-c{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*5);text-transform:capitalize}
.sem.grande{width:calc(var(--u)*64);height:calc(var(--u)*80);border:0}
.sem.grande svg{width:calc(var(--u)*40);height:calc(var(--u)*50)}
.troje-c{display:flex;flex-direction:column;gap:calc(var(--u)*6);aspect-ratio:auto;text-align:center}
.troje-m{aspect-ratio:1;width:100%}
.res{max-width:calc(var(--u)*280);text-align:center}
.res .res-fila{justify-content:center;text-align:left}
.instr{flex:none;max-width:calc(var(--u)*280);text-align:center;font:500 calc(var(--u)*13)/1.4 var(--body);color:#FFFFFF;text-shadow:0 1px 3px rgba(0,0,0,.7);text-wrap:balance;margin:0}
.meta small{font:600 calc(var(--u)*11)/1 var(--body);color:var(--suave);letter-spacing:.02em}
.meta b{font:900 calc(var(--u)*30)/1 var(--display)}
.meta .llevas{font:600 calc(var(--u)*11)/1 var(--body);color:var(--suave)}
.j-top.con-instr{justify-content:flex-start;align-items:center}
.j-top .instr{padding-left:calc(var(--u)*54);text-align:left;max-width:none;flex:1}
.zona{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*10)}
.zona .pisos{flex:0 1 auto;min-height:0;padding-top:calc(var(--u)*12);gap:calc(var(--u)*15)}
.zona > *{flex-shrink:0}
.zona > .pisos{flex-shrink:1}
.ofrenda .j-top.con-instr{padding-left:0}
.zona .avance:empty{display:none}
.zona-o{justify-content:flex-start;position:relative}
/* la explicación antes de las Lluvias y la Quema: tapa el juego (solo queda volver) y lo muestra animado */
.juego.esperando .zona,.juego.esperando .abajo-j,.juego.esperando .j-top .instr{visibility:hidden}
.juego .j-top{z-index:4}
.velo.inicio{z-index:3;background:rgba(6,10,8,.6);padding:calc(env(safe-area-inset-top,0px) + var(--u)*74) calc(var(--u)*14) calc(env(safe-area-inset-bottom,0px) + var(--u)*18);align-items:center}
.velo.inicio > .placa{width:100%;max-width:calc(var(--u)*300);gap:calc(var(--u)*14);padding:calc(var(--u)*20) calc(var(--u)*18)}
.velo .placa.accion{flex-direction:row}
.demo{display:flex;align-items:flex-end;justify-content:center;gap:calc(var(--u)*14)}
.demo-col{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*6)}
.demo-cola{position:relative;width:calc(var(--u)*84);height:calc(var(--u)*44);border-radius:calc(var(--u)*14);box-shadow:inset 0 0 0 calc(var(--u)*2.5) var(--pieza)}
.demo-cola .pz{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.demo-cola .barra,.demo-carta .barra{width:calc(var(--u)*62);height:calc(var(--u)*15)}
.demo-cola .grano,.demo-carta .grano{width:calc(var(--u)*16);height:calc(var(--u)*19)}
.demo-carta{position:relative;width:calc(var(--u)*124);display:flex;flex-direction:column;gap:calc(var(--u)*8);padding:calc(var(--u)*10);border-radius:calc(var(--u)*18);box-shadow:inset 0 0 0 calc(var(--u)*1.6) var(--linea);animation:dCarta 4.8s infinite}
.demo-carta .n{font:900 calc(var(--u)*24)/1 var(--display)}
.demo-carta .mp{height:calc(var(--u)*72);border:calc(var(--u)*1.4) dashed var(--linea);border-radius:calc(var(--u)*10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*6)}
.demo-carta .fila-g{display:flex;gap:calc(var(--u)*6)}
.demo-dedo{position:absolute;left:50%;top:58%;width:calc(var(--u)*34);height:calc(var(--u)*34);margin:calc(var(--u)*-17) 0 0 calc(var(--u)*-17);border-radius:50%;border:calc(var(--u)*3) solid var(--tinta);opacity:0;animation:dDedo 4.8s infinite;z-index:2}
.q1{animation:dQ1 4.8s infinite} .q2{animation:dQ2 4.8s infinite} .q3{animation:dQ3 4.8s infinite}
.p1{animation:dP1 4.8s infinite} .p2{animation:dP2 4.8s infinite} .p3{animation:dP3 4.8s infinite}
.demo-carta .tiempo i{animation:dTiempo 4.8s linear infinite}
@keyframes dQ1{0%,12%{opacity:1}14%,100%{opacity:0}}
@keyframes dQ2{0%,13%{opacity:0}15%,28%{opacity:1}30%,100%{opacity:0}}
@keyframes dQ3{0%,29%{opacity:0}31%,44%{opacity:1}46%,100%{opacity:0}}
@keyframes dP1{0%,13%{opacity:0;transform:translateY(calc(var(--u)*-14))}17%,86%{opacity:1;transform:none}92%,100%{opacity:0}}
@keyframes dP2{0%,29%{opacity:0;transform:translateY(calc(var(--u)*-14))}33%,86%{opacity:1;transform:none}92%,100%{opacity:0}}
@keyframes dP3{0%,45%{opacity:0;transform:translateY(calc(var(--u)*-14))}49%,86%{opacity:1;transform:none}92%,100%{opacity:0}}
@keyframes dDedo{0%,8%{opacity:0;transform:scale(1.5)}12%{opacity:.9;transform:scale(1)}15%{opacity:0}24%{opacity:0;transform:scale(1.5)}28%{opacity:.9;transform:scale(1)}31%{opacity:0}40%{opacity:0;transform:scale(1.5)}44%{opacity:.9;transform:scale(1)}47%,100%{opacity:0}}
@keyframes dCarta{0%,50%{box-shadow:inset 0 0 0 calc(var(--u)*1.6) var(--linea)}54%,86%{box-shadow:inset 0 0 0 calc(var(--u)*3.4) var(--acento)}92%,100%{box-shadow:inset 0 0 0 calc(var(--u)*1.6) var(--linea)}}
@keyframes dTiempo{0%{width:100%}50%,86%{width:55%}100%{width:100%}}
.pasos{list-style:none;margin:0;padding:0;display:grid;gap:calc(var(--u)*10);width:100%}
.pasos li{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*8);text-align:center}
.pasos .grano{width:calc(var(--u)*16);height:calc(var(--u)*19)} .pasos .barra{width:calc(var(--u)*56);height:calc(var(--u)*14);margin-left:calc(var(--u)*8)}
.demo-reloj{width:calc(var(--u)*46);height:calc(var(--u)*8);border-radius:99px;background:rgba(127,127,127,.25);overflow:hidden;flex:none}
.demo-reloj i{display:block;height:100%;width:45%;background:var(--pieza);border-radius:99px}
@media (prefers-reduced-motion: reduce){.demo *,.demo-carta{animation:none!important}.q2,.q3,.demo-dedo{opacity:0}}
.velo.inicio .txt,.velo.inicio .sub{margin:0;text-align:center;text-wrap:pretty}
.velo.inicio .placa{gap:calc(var(--u)*12)}
.zona-o .cola{flex:none}
.zona-o .matas{flex:1}
.zona .piso{flex:0 1 var(--alto-piso);height:auto;max-height:var(--alto-piso);min-height:calc(var(--u)*40)}   /* se encogen para caber siempre entre la meta y el botón de abajo */
.zona .piso{container-type:size}
/* las piezas se ajustan al alto del piso: 4 puntos y 3 barras siempre caben */
.zona .piso .grano{width:min(calc(var(--u)*22),17cqh);height:min(calc(var(--u)*26),20cqh)}
.zona .piso .barra{height:min(calc(var(--u)*24),15cqh)}
.zona .piso .col-b{gap:min(calc(var(--u)*8),4cqh)}
.zona .piso .fila-g{gap:min(calc(var(--u)*9),5cqh)}
.zona .piso .cont-piso{gap:min(calc(var(--u)*10),5cqh)}
.zona .piso .concha{height:min(calc(var(--u)*28),24cqh);width:auto}
.mata-c .pide{font:600 calc(var(--u)*11)/1 var(--body);color:var(--suave)}
.estado .barra-av{width:calc(var(--u)*34)}
.estado .ico{width:calc(var(--u)*21);height:calc(var(--u)*21)}
.estado .franjas i{width:calc(var(--u)*5);height:calc(var(--u)*14)}
.estado .puntos i{width:calc(var(--u)*6);height:calc(var(--u)*6)}
.con-volver .estado{left:calc(var(--u)*64);right:calc(var(--u)*10);max-width:calc(100% - var(--u)*74)}
.puntos.agua{color:#3E8FD8}
.pisos-i{width:calc(var(--u)*44);height:calc(var(--u)*36);flex:none}

/* marcas sobre el mundo */
.marca{position:absolute;left:0;top:0;width:calc(var(--u)*26);height:calc(var(--u)*26);margin:calc(var(--u)*-13) 0 0 calc(var(--u)*-13);border-radius:50%;
  background:var(--placa);display:flex;align-items:center;justify-content:center;box-shadow:0 calc(var(--u)*2) 0 var(--sombra)}
.marca svg{width:calc(var(--u)*16);height:calc(var(--u)*20)}
.marca.obra svg{width:calc(var(--u)*22);height:calc(var(--u)*22)}
.trazo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* la hoja de la troje y las secciones */
.hoja{position:absolute;left:0;right:0;bottom:0;background:var(--solida);color:var(--tinta);border-radius:calc(var(--u)*28) calc(var(--u)*28) 0 0;
  padding:calc(var(--u)*22) calc(var(--u)*22) calc(env(safe-area-inset-bottom,0px) + var(--u)*24);box-shadow:0 calc(var(--u)*-8) calc(var(--u)*24) rgba(0,0,0,.25);pointer-events:auto}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*14)}
.sec{height:calc(var(--u)*86);border-radius:calc(var(--u)*20);border:calc(var(--u)*1.6) solid var(--suave);display:flex;flex-direction:column;gap:calc(var(--u)*6);align-items:center;justify-content:center}
.sec.hoy{border:calc(var(--u)*3) solid var(--acento);color:var(--acento)}
.dev-b{width:calc(var(--u)*40);height:calc(var(--u)*40);border-radius:50%;color:#FFFFFF;opacity:.55;font:900 calc(var(--u)*20)/1 var(--display)}
.seccion{position:absolute;inset:0;background:var(--solida);color:var(--tinta);display:flex;flex-direction:column;pointer-events:auto}
.s-cab{position:relative;flex:none;height:calc(env(safe-area-inset-top,0px) + var(--u)*78);display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--u)*12)}
.s-cab .volver{position:absolute;left:calc(var(--u)*14);bottom:calc(var(--u)*8)}
.s-cont{flex:1;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:calc(var(--u)*14) calc(var(--u)*18) calc(env(safe-area-inset-bottom,0px) + var(--u)*120)}
.s-pie{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*24);display:flex;justify-content:center;pointer-events:none}
.s-pie > *{pointer-events:auto}
.tog{display:flex;border:calc(var(--u)*1.4) solid var(--suave);border-radius:99px;padding:calc(var(--u)*3);width:max-content;margin:0 auto calc(var(--u)*18)}
.tog button{width:calc(var(--u)*120);gap:calc(var(--u)*6);height:calc(var(--u)*34);border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--suave)}
.tog button[aria-pressed="true"]{background:var(--acento);color:var(--solida)}
.rejilla{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--u)*16) calc(var(--u)*8);justify-items:center}
.maz{width:100%;height:calc(var(--u)*120);display:flex;align-items:center;justify-content:center;border-radius:calc(var(--u)*14);padding:calc(var(--u)*6) 0}
button.maz{background:rgba(127,127,127,.13)}
.velo .mz{background:rgba(127,127,127,.13);border-radius:calc(var(--u)*22);padding:calc(var(--u)*14) calc(var(--u)*22)}
.maz svg,.maz .mz-img{height:100%;width:auto;max-width:100%}
.mz-img{display:block;image-rendering:pixelated}
.maz.falta::before{content:"";width:calc(var(--u)*40);height:calc(var(--u)*96);border:calc(var(--u)*2.4) dashed var(--suave);opacity:.45;border-radius:50%}
.filas{display:grid;gap:calc(var(--u)*12)}
.fila-s{display:flex;align-items:center;gap:calc(var(--u)*14);padding:calc(var(--u)*12) calc(var(--u)*16);border-radius:calc(var(--u)*18);border:calc(var(--u)*1.4) solid var(--linea);min-height:calc(var(--u)*64)}
.fila-s .barra-av{flex:1}
.estela{display:grid;gap:calc(var(--u)*10);justify-content:center;margin-top:calc(var(--u)*10)}
.estela .dig{display:grid;grid-template-columns:calc(var(--u)*64) calc(var(--u)*130);align-items:center;gap:calc(var(--u)*12);padding:calc(var(--u)*12) calc(var(--u)*14);border-radius:calc(var(--u)*16);border:calc(var(--u)*1.4) dashed var(--linea);min-height:calc(var(--u)*70)}
.estela .mul{font:900 calc(var(--u)*16)/1 var(--display);color:var(--suave);text-align:right}
.estela .maya{color:#D9A21A;justify-self:center}
.semis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:calc(var(--u)*12);justify-items:center}
.sem{width:calc(var(--u)*50);height:calc(var(--u)*64);border-radius:calc(var(--u)*14);display:flex;align-items:center;justify-content:center;border:calc(var(--u)*1.4) solid var(--linea)}

  <div id="marcas"></div>
  <div id="ui"></div>
  <div id="calor"></div>
  <div id="reloj" aria-hidden="true"></div>

   ==================================================================================================== */

  cv.width=Math.max(1,Math.round(appW*dpr));cv.height=Math.max(1,Math.round(appH*dpr));U=appW/300;app.style.setProperty('--u',U+'px');}
medir();
/* el mapa se genera con la proporción de la pantalla, para que el monte quepa entero */
const ALTO=Math.max(300,Math.min(460,Math.round(180*appH/appW)));
window.MILPA_H=ALTO; window.MILPA_OY=Math.round((ALTO-300)/2);

  const s=document.createElement('script');s.src=rutas[i++];s.onload=()=>ok();s.onerror=()=>{s.remove();intenta();};document.head.appendChild(s);};intenta();});}
let D,MODO='prueba';
try{
  await cargarScript(['milpa-maiz.js','../../docs/milpa-maiz.js']);
  await cargarScript(['milpa-render.js','../../docs/milpa-render.js']);
  await cargarScript(['motor.js']);
  D=await (await fetch('datos.json')).json();
  /* la prueba con amigos (prueba.js, opcional): la ronda llega por el enlace y fija el modo antes de leerlo */
  await cargarScript(['prueba.js']).catch(()=>{});
  if(window.MilpaPrueba)await MilpaPrueba.elegirSiHaceFalta();
  /* el modo prueba de un día (Luis, 19 nov): para descubrir casi todo el monte en un día de pruebas, entrando cada ~30 min.
     Solo cambia estos números en memoria (datos.json no se toca). Simulado: 13 de 14 parcelas y el piso 3 en ~11 h. */
  MODO=((()=>{try{return localStorage.getItem('milpa.prototipo.modo');}catch(e){return null;}})())||'prueba';

/* ---------- números en puntos y barras: un piso por cada potencia de 20, de arriba (el mayor) abajo ---------- */
function maya(n,{r=3.4,bw=24,bh=5,gap=3,gapPiso=8}={}){
  const dig=[];if(n<=0)dig.push(0);else{let v=n;while(v>0){dig.unshift(v%20);v=Math.floor(v/20);}}
  const dw=r*2+2.4;let ancho=bw;dig.forEach(d=>{ancho=Math.max(ancho,(d%5)*dw);});const cx=ancho/2;
  let y=0;const s=[];
  dig.forEach((d,k)=>{if(k)y+=gapPiso;
    if(d===0){s.push(`<path d="M${cx-9},${y+5} q9,-10 18,0 q-9,6 -18,0z" fill="none" stroke="currentColor" stroke-width="2"/>`);y+=8;return;}
    const b=Math.floor(d/5),p=d%5;
    if(p){const t=p*dw;for(let i=0;i<p;i++)s.push(`<rect x="${(cx-t/2+dw/2+i*dw-r).toFixed(2)}" y="${y}" width="${r*2}" height="${r*2}" fill="currentColor"/>`);y+=r*2+(b?gap:0);}
    for(let i=0;i<b;i++){s.push(`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${bh}" fill="currentColor"/>`);y+=bh+(i<b-1?gap:0);}
  });
  return `<svg class="maya" shape-rendering="crispEdges" viewBox="-1 -1 ${ancho+2} ${y+2}" style="width:calc(var(--u)*${ancho+2});height:calc(var(--u)*${y+2})" role="img" aria-label="${n}">${s.join('')}</svg>`;}
const franjas=(n,max=4)=>`<span class="franjas">${Array.from({length:max},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;
const puntos=(n,max=3)=>`<span class="puntos">${Array.from({length:max},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;
const barraAv=p=>`<span class="barra-av"><i style="width:${Math.round(cl(p)*100)}%"></i></span>`;
const pisosSVG=piso=>`<svg class="pisos-i" viewBox="0 0 44 36" aria-label="piso ${piso}">${[0,1,2,3,4].map(i=>`<rect x="${2+i*8}" y="${33-(6+i*7)}" width="6" height="${6+i*7}" style="fill:${i<piso?'var(--acento)':'none'};stroke:var(--tinta)" stroke-width="1.4"/>`).join('')}</svg>`;

const EXTRAS=['milpa.prototipo.vistos','milpa.prototipo.sucesos','milpa.prototipo.arreglos','milpa.prototipo.practica','milpa.prototipo.modo'];
const NUBE={ref:null,estado:'local',hora:0,enCurso:false,timer:null,pendiente:false};
async function abrirNube(){
  if(!(window.claude&&window.claude.use))return null;
  try{const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return null;
    const id=await user.id();if(!id)return null;NUBE.ref=db.doc('data/users/'+id+'/milpa');   /* un documento: data/users/<id>/<doc> */NUBE.estado='conectando';
    const snap=await NUBE.ref.get();return snap.exists?(snap.data()||{}):{};}
  catch(e){NUBE.estado='sin conexión';return null;}}
function adoptar(d){try{JSON.parse(d.est);ls.set(CLAVE,d.est);const x=JSON.parse(d.extra||'{}');for(const k of EXTRAS){if(x[k]!=null)ls.set(k,x[k]);else ls.del(k);}
  ls.set('milpa.prototipo.accion',String(d.accion||Date.now()));return true;}catch(e){return false;}}

else if(ls.get('milpa.prototipo.accion')==null)ls.set('milpa.prototipo.accion','1');

{const b=document.getElementById('reiniciar');let t0=null;

const SEMILLA=Math.floor(MilpaMaiz.hash('mapa',est.jugador)*2147483646)+1;   /* cada jugador, su milpa */
const posDe=i=>`${i%3},${Math.floor(i/3)}`;
const slotDe=pos=>{const [c,r]=pos.split(',').map(Number);return r*3+c;};
const TROJES=['casa','adobe','lamina','chiil','cuexcomate'];
const RUMBOS=['rojo','blanco','negro','amarillo'];
const colorDeTipo=tipo=>MilpaMaiz.COLOR[(tipo||'').split(' ')[0]]||'#E9B320';
const colorSemilla=i=>typeof i==='string'?MilpaMaiz.COLOR[i]:(est.semillas[i]?colorDeTipo(est.semillas[i].muestra):'#9AA39A');
const semillaSVG=(col)=>`<svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 2 c7 0 9 9 9 15 c0 8 -4 11 -9 11 c-5 0 -9 -3 -9 -11 c0 -6 2 -15 9 -15z" fill="${col}" stroke="currentColor" stroke-width="1.6"/></svg>`;
const horaJuego=()=>{const x=MilpaMotor.horaDeJuego(est,Date.now());return ((x%24)+24)%24;};
const estacionHoyJ=()=>MilpaMotor.estacion(D,est,Date.now());
const pend=()=>MilpaMotor.pendientes(D,est);
const aprend=()=>MilpaMotor.aprendizaje(D,est);

/* ====================================================================================================
   el mundo: del estado del motor a la milpa dibujada
   ==================================================================================================== */
function visual(pos){
  if(est.construyendo&&est.construyendo.pos===pos)return 'obra';
  const p=est.parcelas[pos];if(!p)return 'monte';
  switch(p.estado){
    case 'porAbrir':return 'perdida';                                   /* monte joven: se quema para abrirla */
    case 'vacia':return p.ceniza>=D.ceniza.cosechas?'ceniza':'vacia';    /* recién quemada = ceniza; si no, pasto */
    case 'creciendo':{if(p.lluvias===0)return 'sembrada';const hrs=p.primera?D.aprendizaje.primer_cultivo_horas:D.cultivo.horas;return p.crecido<hrs*.45?'creciendo':'verde';}
    case 'lista':return p.t<D.cultivo.lista_sin_perder?'madura':'pasada';
    case 'marchita':return 'marchita';
    case 'podrida':return 'descuidada';
  }return 'monte';}
const firmaMundo=()=>ORDEN.map(i=>{const pos=posDe(i),p=est.parcelas[pos];return visual(pos)+(p?p.nivel:'');}).join('|')+'|'+(est.troje.version??0)+'|'+est.troje.piso;
let G=null,S=null,sH=-99,sE=0,firmaG='',regenPendiente=false;
function regenerar(){
  const estados=ORDEN.map(i=>visual(posDe(i))), niveles=ORDEN.map(i=>{const p=est.parcelas[posDe(i)];return p?p.nivel:1;});
  G=Object.assign(generar(SEMILLA,'poligonos',14,estados,niveles,{troje:TROJES[est.troje.version??0],piso:est.troje.piso}),{principal:true});
  firmaG=firmaMundo();S=null;bordesFirma='';}
function asegurarS(hv){const e=estacionHoyJ();let d=Math.abs(hv-sH);d=Math.min(d,24-d);if(!S||d>.2||e!==sE){S=sombrear(G,hv,e);sH=hv;sE=e;}}
const OFF=document.createElement('canvas');OFF.width=W;OFF.height=H;

/* la lluvia que cae (después de jugar Lluvias) y su relámpago si fue buena */
let lluviaVis=null;
function iniciarLluviaVis(buena){lluviaVis={t0:performance.now()/1000+.35,buena,sh:buena?sombraRel(G,Math.random()*Math.PI*2):null};}
function estadoLluviaVis(t){if(!lluviaVis)return{I:0,hum:0,flash:0,sh:null};const e=t-lluviaVis.t0;
  const I=e<0?0:e<1.5?e/1.5:e<8?1:e<10?(10-e)/2:0, hum=e<0?0:e<10?Math.min(1,e/4):Math.max(0,1-(e-10)/30);
  const flash=lluviaVis.buena?envolvente(e-1.7):0;const sh=lluviaVis.sh;if(e>40)lluviaVis=null;return{I,hum,flash,sh};}
const flashActivo=t=>lluviaVis&&lluviaVis.buena&&t-lluviaVis.t0>1.6&&t-lluviaVis.t0<2.4;
function prepararS(t){const pe=pend();const r=estadoLluviaVis(t);
  S.espera=pe.lluvia>0&&!(r.I>0)?1:0;S.esperaModo='luz gotas animales';S.lluvia=r.I;S.hum=r.hum;S.flash=r.flash;S.flashModo='luz';S.flashSh=r.sh;}

/* las parcelas que piden algo laten en su orilla: una máscara del tamaño del mapa, que se dibuja con la cámara */
let bordes=null,bordesFirma='';
function pedidos(){const s=new Set();pend().parcelas.forEach(q=>s.add(slotDe(q.pos)));const ap=aprend();if(ap==='troje'||ap==='elegir_troje')s.add(TROJE);return s;}
function hacerBordes(set){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const im=x.createImageData(W,H),own=G.own;
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const p=y*W+xx,o=own[p];if(o<0||!set.has(o))continue;let b=false;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const X=xx+dx,Y=y+dy;if(X<0||Y<0||X>=W||Y>=H||own[Y*W+X]!==o){b=true;break;}}
    if(!b)continue;
    for(const [dx,dy] of [[0,0],[1,0],[0,1],[-1,0],[0,-1]]){const X=xx+dx,Y=y+dy;if(X<0||Y<0||X>=W||Y>=H||own[Y*W+X]!==o)continue;const i=(Y*W+X)*4;im.data[i]=255;im.data[i+1]=206;im.data[i+2]=64;im.data[i+3]=255;}}
  x.putImageData(im,0,0);return c;}
function revisarBordes(){const set=pedidos();const f=[...set].sort().join(',')+'|'+firmaG;if(f!==bordesFirma){bordes=set.size?hacerBordes(set):null;bordesFirma=f;}}

/* ====================================================================================================
   la cámara: centro y zoom juntos, en línea recta; al entrar frena al llegar, al volver sale y frena suave
   ==================================================================================================== */
const cam={cx:90,cy:150,w:180,fy:.5,osc:0,bor:0};let camTr=null;
function moverCam(a,dur,ease){camTr={de:{...cam},a,t0:performance.now(),dur,ease};}
function vistaDe(c){const alto=Math.min(H,c.w*appH/appW);const x=Math.max(0,Math.min(W-c.w,c.cx-c.w/2)),y=Math.max(0,Math.min(H-alto,c.cy-alto*c.fy));return{x,y,w:c.w,h:alto,esc:appW/c.w};}
function camDe(tipo,d){
  const mw=Math.min(W,H*appW/appH);const monte={cx:W/2,cy:H/2,w:mw,fy:.5,osc:0,bor:0};
  if(tipo==='monte'||tipo==='semilla')return monte;
  if(tipo==='parcela'){const s=G.slots[slotDe(d.pos)];return{cx:s.x,cy:s.y,w:Math.min(mw,92),fy:.46,osc:0,bor:0};}
  if(tipo==='troje'||tipo==='seccion'){const s=G.slots[TROJE];return{cx:s.x,cy:s.y,w:Math.min(mw,96),fy:.46,osc:0,bor:0};}
  if(tipo==='juego'){if(d.pos){const s=G.slots[slotDe(d.pos)];return{cx:s.x,cy:s.y,w:Math.min(mw,70),fy:.5,osc:.5,bor:6};}
    if(d.practica){const s=G.slots[TROJE];return{cx:s.x,cy:s.y,w:Math.min(mw,62),fy:.3,osc:.55,bor:6};}
    return{...monte,osc:.5,bor:6};}
  return monte;}
function slotEn(x,y){const r=app.getBoundingClientRect(),v=vistaDe(cam);const wx=Math.floor(v.x+(x-r.left)/v.esc),wy=Math.floor(v.y+(y-r.top)/v.esc);
  if(wx<0||wy<0||wx>=W||wy>=H)return -1;return G.own[wy*W+wx];}

/* ====================================================================================================
   tema de la interfaz: placas blancas de día, azul noche de noche (sigue la hora del juego)
   ==================================================================================================== */
let TEMA={noche:null};
function aplicarTema(hv){const noche=hv<6||hv>=19.8;if(noche===TEMA.noche)return;
  TEMA=noche?{noche:true,placa:'#1B2440',solida:'#141B33',tinta:'#EEF2F8',suave:'#A9B4C8',acento:'#F2C230',sombra:'rgba(0,0,0,.35)',linea:'rgba(169,180,200,.3)',borde:'#05070F'}
            :{noche:false,placa:'#FFFFFF',solida:'#FFFFFF',tinta:'#18201A',suave:'#5E6A5C',acento:'#2F7A3A',sombra:'rgba(0,0,0,.18)',linea:'rgba(94,106,92,.3)',borde:'#18201A'};
  for(const k of ['placa','solida','tinta','suave','acento','sombra','linea','borde'])app.style.setProperty('--'+k,TEMA[k]);app.classList.toggle('noche',noche);
  if(actualizarCapa)actualizarCapa(true);}

/* ====================================================================================================
   las pantallas y sus transiciones (docs/milpa-estetica.md §23)
   ==================================================================================================== */
const DUR={'monte>parcela':450,'parcela>parcela':380,'parcela>juego':420,'juego>parcela':360,'parcela>monte':400,'monte>troje':440,'parcela>troje':440,'troje>monte':380,
  'troje>seccion':340,'seccion>troje':300,'seccion>semilla':500,'semilla>monte':300,'monte>juego':420,'juego>monte':400,'seccion>juego':380,'juego>seccion':340,'seccion>seccion':300};
let pant={tipo:null,d:{}},capa=null,actualizarCapa=null,juegoId=0;
function ir(tipo,d={},o={}){
  const de=pant.tipo;let dur=o.dur||DUR[de+'>'+tipo]||400;if(QUIETO)dur=160;
  if(window.MilpaPrueba)MilpaPrueba.pantalla(tipo,de);
  juegoId++;cerrarDev();
  if(capa){const vieja=capa;vieja.querySelectorAll('button,.t').forEach(x=>x.style.pointerEvents='none');salir(vieja,dur);}
  pant={tipo,d};
  {const vis=['monte','parcela','troje'].includes(tipo);for(const id of ['reiniciar','reloj']){const x=document.getElementById(id);if(x)x.hidden=!vis;}}   /* ni el botón de la prueba ni el reloj tapan los juegos */   /* el botón de la prueba no tapa los juegos */
  if(!de)Object.assign(cam,camDe(tipo,d));else moverCam(camDe(tipo,d),dur,o.atras?easeInOut:easeOut);
  const r=construir(tipo,d);capa=r.el;actualizarCapa=r.act||null;ui.appendChild(capa);if(de)entrar(capa,dur);
  if(actualizarCapa)actualizarCapa(true);
  bordesFirma='';
  if(tipo==='troje'&&aprend()==='elegir_troje')setTimeout(()=>{if(pant.tipo==='troje')ir('seccion',{s:'tu_troje'});},QUIETO?200:750);}
function salir(el,dur){
  if(QUIETO){el.animate([{opacity:1},{opacity:0}],{duration:dur,fill:'forwards'});setTimeout(()=>el.remove(),dur+20);return;}
  for(const x of el.children){
    if(x.matches('.hoja'))x.animate([{transform:'none'},{transform:'translateY(100%)'}],{duration:dur*.6,easing:ACCEL,fill:'forwards'});
    else if(x.matches('.seccion'))x.animate([{transform:'none',opacity:1},{transform:`translateY(${40*U}px)`,opacity:0}],{duration:dur*.8,easing:ACCEL,fill:'forwards'});
    else x.animate([{opacity:1,transform:'none'},{opacity:0,transform:`translateY(${-8*U}px)`}],{duration:Math.max(100,dur*.35),easing:ACCEL,fill:'forwards'});}
  setTimeout(()=>el.remove(),dur*.85+30);}
function entrar(el,dur){
  if(QUIETO){el.animate([{opacity:0},{opacity:1}],{duration:dur});return;}
  for(const x of el.children){
    if(x.matches('.hoja'))x.animate([{transform:'translateY(100%)'},{transform:'none'}],{duration:dur*.85,delay:dur*.15,easing:DECEL,fill:'backwards'});
    else if(x.matches('.seccion'))x.animate([{opacity:0,transform:`translateY(${40*U}px)`},{opacity:1,transform:'none'}],{duration:dur,easing:DECEL,fill:'backwards'});
    else x.animate([{opacity:0,transform:`translateY(${16*U}px)`},{opacity:1,transform:'none'}],{duration:dur*.6,delay:dur*.4,easing:DECEL,fill:'backwards'});}}
function atras(){const t=pant.tipo,d=pant.d;
  if(t==='parcela'){if(est.visto.monte)ir('monte',{},{atras:true});}
  else if(t==='troje'||t==='semilla')ir('monte',{},{atras:true});
  else if(t==='seccion')ir('troje',{},{atras:true});
  else if(t==='juego'){if(d.practica)ir('seccion',{s:'la_practica'},{atras:true});else if(d.pos)ir('parcela',{pos:d.pos},{atras:true});else ir('monte',{},{atras:true});}}
const btnVolver=(fn,cls='arriba izq')=>boton('placa redonda volver '+cls,svgI(IC.volver()),'volver',fn);
function construir(tipo,d){
  if(tipo==='monte')return capaMonte();
  if(tipo==='parcela')return capaParcela(d);
  if(tipo==='juego')return capaJuego(d);
  if(tipo==='troje')return capaTroje();
  if(tipo==='seccion')return capaSeccion(d);
  if(tipo==='semilla')return capaSemilla();
  return{el:h('div','capa')};}

/* ---------- textos (paso 6): voz clara, de tú; dicen qué pasa y qué hacer ---------- */
const pl=(n,uno,varios)=>`${fmtN(n)} ${n===1?uno:varios}`;
const horas=x=>x<1?'menos de 1 h':`${Math.ceil(x)} h`;
const reloj=x=>{const hh=Math.floor(x),mm=Math.floor((x-hh)*60);return `${hh}:${String(mm).padStart(2,'0')}`;};
const RUMBO={rojo:'oriente',blanco:'norte',negro:'poniente',amarillo:'sur'};
const nombreMaiz=tipo=>'Maíz '+tipo;
const NOMBRE_SEC={hoy:'Hoy',la_cuenta:'La cuenta',las_mazorcas:'Las mazorcas',las_semillas:'Las semillas',la_practica:'La práctica',tu_troje:'Tu troje'};
const nombreTroje=i=>{const s=D.troje.versiones[i]||'';return s.charAt(0).toUpperCase()+s.slice(1);};
function proximaLluvia(hv){const hs=D.lluvia.horas;for(const x of hs)if(x>hv+.01)return x;return hs[0];}
function nombreParcela(p){return p.segura?`Parcela del ${RUMBO[p.rumbo]}`:'Parcela';}
let VISTOS={};try{VISTOS=JSON.parse(ls.get('milpa.prototipo.vistos')||'{}');}catch(e){VISTOS={};}
const visto=k=>!!VISTOS[k], marcar=k=>{VISTOS[k]=1;ls.set('milpa.prototipo.vistos',JSON.stringify(VISTOS));};
function ponDicho(el,texto){if(el._t===texto)return;el._t=texto;el.textContent=texto||'';el.hidden=!texto;}

/* ---------- altura 1 · el monte ---------- */
function guiaMonte(pe){
  const ap=aprend();
  if(ap==='troje'||ap==='elegir_troje')return{t:'Tus mazorcas se guardan en la troje, la casa del centro. Tócala.'};
  if(!visto('monte'))return{t:'Este es tu monte. Las parcelas que laten te piden algo: tócalas. Llueve a las 6, 12 y 18 h, y la lluvia te espera. (Toca este aviso para cerrarlo.)',cierra:'monte'};
  if(!visto('zoom'))return{t:'Pellizca con dos dedos para acercarte y mirar de cerca. Si miras con calma, a veces pasan cosas extrañas.',cierra:'zoom'};
  if(pe.lluvia>0)return{t:''};
  if(est.espera>0&&pe.parcelas.some(q=>q.que==='sembrar'))return{t:`${pl(est.espera,'lluvia te espera','lluvias te esperan')}: siembra primero y luego déjala caer.`};
  if(pe.faltan===0){const c=est.construyendo;
    return{t:c?`Todo en orden. Se está abriendo una parcela nueva: faltan ${horas(c.falta)}.`:`Todo en orden. La próxima lluvia llega a las ${proximaLluvia(horaJuego())}:00.`};}
  return{t:''};}
function capaMonte(){
  const el=h('div','capa monte d-skin');
  const estB=boton('placa pildora arriba izq','','estación (mantén el dedo para el panel del prototipo)',()=>{});mantener(estB,abrirDev);
  const falt=h('div','placa pildora arriba der');
  const di=h('div','placa dicho alto t');di.hidden=true;di.addEventListener('click',()=>{if(di._cierra){marcar(di._cierra);di._t=null;if(actualizarCapa)actualizarCapa(true);}});
  const llu=boton('placa accion abajo centro','','dejar caer las lluvias',()=>{if(QUIETO){ir('juego',{tipo:'lluvia'});return;}
    llu.animate([{transform:'none',opacity:1},{transform:'scale(.86)',opacity:0}],{duration:220,easing:ACCEL,fill:'forwards'});setTimeout(()=>ir('juego',{tipo:'lluvia'}),180);});
  el.append(estB,falt,di,llu);
  let kE=null,kF=null,kL=null;
  return{el,act(forzar){if(forzar){kE=kF=kL=null;}
    const e=estacionHoyJ();if(e!==kE){kE=e;estB.innerHTML=svgI(IC.est[e]())+`<span class="tit">${ESTS[e].n}</span>`;}
    const pe=pend();
    if(pe.faltan!==kF){kF=pe.faltan;falt.innerHTML=`<span class="txt">Pendientes</span>`+maya(pe.faltan,{r:3.2,bw:20,bh:4.5});falt.style.visibility=pe.faltan>0?'visible':'hidden';}
    if(pe.lluvia!==kL){kL=pe.lluvia;llu.innerHTML=svgI(IC.lluvia(),'ico m acc')+`<span class="tit">Dejar caer</span>`+maya(pe.lluvia,{r:3.4})+`<span class="txt">${pe.lluvia===1?'lluvia':'lluvias'}</span>`;llu.style.display=pe.lluvia>0?'':'none';}
    const g=guiaMonte(pe);di._cierra=g.cierra||null;ponDicho(di,g.t);}};}

/* ---------- altura 2 · la parcela ---------- */
function estadoParcela(p,obra){
  if(obra){const c=est.construyendo;return{ico:svgI(IC.obra(),'ico acc'),tit:'Se abre una parcela',chips:[barraAv(1-c.falta/c.total)+`<span>faltan ${horas(c.falta)}</span>`],
    guia:'Se está limpiando el monte. Cuando termine, quémalo para abrir la parcela.'};}
  if(!p)return null;
  const hrs=p.primera?D.aprendizaje.primer_cultivo_horas:D.cultivo.horas,C=D.cultivo;
  const chips=[];
  if(p.estado!=='porAbrir')chips.push(franjas(p.nivel,D.nivel.max)+`<span>Nivel ${p.nivel}</span>`);
  if(p.estado==='creciendo')chips.push(puntos(p.lluvias,D.lluvia.max_por_cultivo).replace('puntos','puntos agua')+`<span>${p.lluvias} de ${D.lluvia.max_por_cultivo} lluvias</span>`);
  if(p.ceniza>0)chips.push(svgI(IC.ceniza(),'ico')+`<span>Ceniza ${p.ceniza}</span>`);
  let ico,tit,guia;
  switch(p.estado){
    case 'porAbrir':ico=IC.arbol();tit='Monte por abrir';guia='Quema el monte para abrir esta parcela. La quema deja ceniza para 3 cosechas.';break;
    case 'vacia':ico=IC.tierra();tit='Lista para sembrar';
      guia=p.ceniza>0?`Siembra. La ceniza mejora ${pl(p.ceniza,'cosecha más','cosechas más')}.`:'Siembra. Si la quemas antes, deja ceniza y la cosecha sale mejor.';break;
    case 'creciendo':ico=IC.brote();
      if(p.lluvias===0){tit='Sembrada';guia='Necesita su primera lluvia para empezar a crecer.';}
      else{tit='Creciendo';guia=`Lista en ${horas(hrs-p.crecido)}. Cada lluvia, hasta 3, mejora la cosecha.`;}
      chips.unshift(barraAv(p.lluvias>0?p.crecido/hrs:0));break;
    case 'lista':ico=IC.mazorca();tit='Lista para cosechar';guia=p.t<C.lista_sin_perder?'Cosecha antes de mañana para no perder calidad.':'Ya está perdiendo calidad: cosecha pronto.';break;
    case 'marchita':ico=IC.mazorca();tit='Marchita';guia=`Se perdió esta cosecha. En ${horas(C.podrida_tras_marchita-p.t)} se pudre, y entonces podrás quemarla.`;break;
    case 'podrida':ico=IC.maleza();tit='Podrida';guia=p.segura?'Quémala para limpiarla.':`Quémala para recuperarla. Si pasan ${horas(C.perdida_tras_podrida-p.t)} más, vuelve a ser monte.`;break;
  }
  if(est.contadores.cosechas===0){const ap=aprend();
    if(ap==='sembrar')guia='Esta es tu primera parcela. Ya está quemada: su ceniza hará buena la cosecha. Toca Sembrar.';
    else if(ap==='llover')guia='Sembraste. Ya hay una lluvia esperando: déjala caer.';
    else if(ap==='esperar')guia='Con la lluvia, el maíz crece. Espera un momento.';
    else if(ap==='cosechar')guia='¡Ya está lista! Cosecha y cuenta tus mazorcas.';}
  const col=p.estado==='lista'||p.estado==='creciendo'?'ico acc':p.estado==='marchita'?'ico sua':'ico';
  return{ico:svgI(ico,col),tit,sub:p.segura?nombreParcela(p):'',chips,guia};}
function estadoParcelaHTML(e){if(!e)return '';
  return `<div class="l1">${e.ico}<span class="tit">${e.tit}</span></div>${e.sub?`<div class="sub">${e.sub}</div>`:''}${e.chips.length?`<div class="l2">${e.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>`:''}`;}
function semillaParaSembrar(p){if(est.contadores.siembras===0)return MilpaMaiz.COLOR[p.rumbo||'amarillo'];if(p.semillaElegida!=null)return colorSemilla(p.semillaElegida);if(p.ultima)return colorDeTipo(p.ultima.tipo);return MilpaMaiz.COLOR.amarillo;}
function accionesParcela(pos){
  const p=est.parcelas[pos];if(!p)return[];const primera=est.contadores.cosechas===0,ll=primera?' llama':'';const L=[];
  const accion=(k,html,label,fn,cls='')=>L.push({k,el:boton('placa accion'+cls,html,label,fn)});

const PESO=[1,20,400,8000,160000];
/* cada siembra y cada cosecha es una serie: al menos 3 juegos, y uno más por cada nivel de la parcela y piso de la troje (Luis, 19 nov) */
/* el balance vive en datos.json (serie) y lo calcula el motor */
const juegosPorVisita=p=>MilpaMotor.juegosPorVisita(D,est,p?p.pos:undefined);
function paramsSiembra(d){
  const piso=Math.min(3,est.troje.piso),ayuda=d.practica||est.contadores.siembras<4;
  if(d.practica)return{metas:Array.from({length:MilpaMotor.juegosPorVisita(D,est)},()=>azar(piso)),F:piso,ayuda};
  if(est.contadores.siembras===0)return{metas:D.aprendizaje.primera_siembra_metas.slice(),F:1,pista:true,ayuda};
  const p=est.parcelas[d.pos],n=juegosPorVisita(p),metas=[];
  while(metas.length<n){const t=azar(piso);if(!metas.includes(t))metas.push(t);}
  return{metas,F:piso,ayuda};}
function azar(piso){const max=PESO[piso]-1,min=piso===1?2:Math.max(2,Math.floor(PESO[piso-1]/2));return min+Math.floor(Math.random()*(max-min+1));}

  for(let y=0;y<Hm;y++)for(let x=0;x<Wm;x++)if(forma(x,y))put(x,y,(y%2)?MZ_OLOTE:MZ_OLOTE2);
  const curva=[.7,.86,1,1,.9,.72],grid={};for(const g of m.granos)grid[g.r+','+g.c]=g;
  for(let r=0;r<L;r++)for(let c=0;c<cols;c++){const g=grid[r+','+c];if(!g)continue;
    const base=hex(MilpaMaiz.tono(MilpaMaiz.COLOR[g.color],m.estacion,r,c)).map(v=>v*(curva[c]??.8));
    const x0=pad+1+c*gw,y0=top+r*gh;
    for(let yy=0;yy<gh;yy++)for(let xx=0;xx<gw;xx++){const x=x0+xx,y=y0+yy;if(!forma(x,y))continue;
      let col=base;if(yy===gh-1||xx===gw-1)col=mix(base,[0,0,0],.32);else if(yy===0&&xx===0)col=mix(base,[255,255,255],.35);

  for(let k=0;k<Wm*Hm;k++){const a=px[k*4+3];if(a<=0)continue;for(let q=0;q<3;q++)im.data[k*4+q]=px[k*4+q]/(a>=1?1:1);im.data[k*4+3]=Math.round(a*255);}

function miniTroje(id,piso,hv){

const valor=f=>f.reduce((s,p,i)=>s+(5*p.b+p.d)*PESO[i],0);
const copia=f=>f.map(p=>({b:p.b,d:p.d}));

async function cascada(f,redibuja,{lento=false}={}){const T1=lento?240:120,T2=lento?200:90;
  for(;;){let k=-1,kind=null;for(let i=0;i<f.length;i++){if(f[i].d>=5){k=i;kind='funde';break;}if(f[i].b>=4&&i+1<f.length){k=i;kind='sube';break;}}
    if(k<0)break;
    if(kind==='funde'){redibuja({glow:{i:k,t:'d',n:5}});await dormir(T1);f[k].d-=5;f[k].b++;redibuja({pop:{i:k,t:'b'}});await dormir(T2);}
    else{redibuja({glow:{i:k,t:'b',n:4}});await dormir(T1);f[k].b-=4;f[k+1].d++;redibuja({pop:{i:k+1,t:'d'}});await dormir(T2+60);}}}
function contenido(p,i,top,fx={},sel=null){

  const pieza=(t,k,n)=>{let c='pz '+(t==='b'?'barra':'grano');if(fx.glow&&fx.glow.i===i&&fx.glow.t===t&&k<fx.glow.n)c+=' glow';if(fx.pop&&fx.pop.i===i&&fx.pop.t===t&&k===n-1)c+=' pop';if(sel&&sel.i===i&&sel.t===t&&k===0)c+=' sel';return `<span class="${c}" data-t="${t}"></span>`;};

  if(p.b){s+='<div class="col-b">';for(let k=0;k<p.b;k++)s+=pieza('b',k,p.b);s+='</div>';}
  return s+'</div>';}
/* tocar = un grano (también encima de otra pieza: el grano nuevo cae bajo el dedo); deslizar de lado = una barra;
   mantener el dedo sobre una pieza = quitarla */
function gestosPiso(el,i,cb){
  let x0=null,y0=0,id=null,rastro=null,largo=null,hecho=false;
  el.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;id=e.pointerId;hecho=false;const pc=e.target.closest('[data-t]');
    try{el.setPointerCapture(id);}catch(_){}
    clearTimeout(largo);if(pc){const t=pc.dataset.t;largo=setTimeout(()=>{if(x0===null)return;hecho=true;pc.animate([{transform:'none',opacity:1},{transform:'scale(.4)',opacity:0}],{duration:160,fill:'forwards'});setTimeout(()=>cb(i,'-'+t),QUIETO?0:150);},450);}});
  el.addEventListener('pointermove',e=>{if(x0===null||e.pointerId!==id)return;const dx=e.clientX-x0,dy=e.clientY-y0;
    if(Math.hypot(dx,dy)>10)clearTimeout(largo);
    if(Math.abs(dx)>16&&!rastro){rastro=h('span','rastro');el.append(rastro);}
    if(rastro){const r=el.getBoundingClientRect();const a=Math.min(x0,e.clientX)-r.left,b=Math.abs(dx);rastro.style.left=a+'px';rastro.style.width=b+'px';}});
  const fin=e=>{if(x0===null||e.pointerId!==id)return;clearTimeout(largo);const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;if(rastro){rastro.remove();rastro=null;}if(e.type==='pointercancel'||hecho)return;
    if(Math.abs(dx)>=30&&Math.abs(dx)>Math.abs(dy))cb(i,'b');else if(Math.abs(dx)<14&&Math.abs(dy)<14)cb(i,'d');};
  el.addEventListener('pointerup',fin);el.addEventListener('pointercancel',fin);
  el.addEventListener('contextmenu',e=>e.preventDefault());}

/* ---------- la Siembra (Escribe): toca un surco = un grano; desliza de lado = una barra (cinco); toca una pieza para quitarla ---------- */
function juegoSiembra(raiz,{metas,F,pista,ayuda},fin,salirJ,vivo){
  raiz.classList.add('siembra');
  const top=h('div','j-top con-instr');top.append(btnVolver(salirJ,''));const meta=h('div','placa meta');
  const av=h('div','avance'),pisosEl=h('div','pisos'),zona=h('div','zona');zona.style.setProperty('--alto-piso',`calc(var(--u)*${[150,150,128,104][F]||104})`);
  const instr=h('p','instr','Toca el surco: un grano. Desliza de lado: una barra.'+(F>1?' Cada piso de arriba vale 20 veces más.':'')+(ayuda?' Para quitar, mantén el dedo encima.':''));

  top.append(instr);zona.append(meta,av,pisosEl);
  raiz.append(top,zona,ley);   /* la explicación arriba; la meta y lo que llevas, justo encima del surco */
  let k=0,f=relleno([],F),busy=false,fx={};const cola=[],pisos=[];
  for(let i=F-1;i>=0;i--){const el=h('div','piso');if(F>1)el.append(h('span','placa mult','×'+fmtN(PESO[i])));const c=h('div','');el.append(c);pisosEl.append(el);pisos[i]={el,c};gestosPiso(el,i,gesto);}
  let pistaEl=null;if(pista&&!QUIETO){pistaEl=h('span','pista');pisos[0].el.append(pistaEl);}
  function dibujar(){meta.innerHTML=`<small>Siembra</small><b>${fmtN(metas[Math.min(k,metas.length-1)])}</b><span class="llevas">llevas ${fmtN(valor(f))}</span>`;
    av.innerHTML=metas.length>1?metas.map((_,j)=>`<i class="${j<k?'on':''}"></i>`).join(''):'';
    let tp=-1;f.forEach((p,i)=>{if(p.b+p.d>0)tp=i;});pisos.forEach((P,i)=>{P.c.innerHTML=contenido(f[i],i,tp,fx);});}
  function gesto(i,t){if(k>=metas.length)return;if(t[0]==='-'&&!busy&&f[i][t[1]]===0)return;if(pistaEl){pistaEl.remove();pistaEl=null;}cola.push([i,t]);correr();}
  async function correr(){if(busy)return;busy=true;
    while(cola.length){const [i,t]=cola.shift();
      if(t[0]==='-'){if(f[i][t[1]]>0)f[i][t[1]]--;fx={};dibujar();continue;}
      f[i][t]++;fx={pop:{i,t}};dibujar();
      await cascada(f,x=>{fx=x;dibujar();});if(!vivo())return;}
    busy=false;fx={};dibujar();
    const T=metas[k],v=valor(f);
    if(v===T){pisos.forEach(P=>P.el.classList.add('ok'));meta.classList.add('bien');await dormir(650);if(!vivo())return;
      pisos.forEach(P=>P.el.classList.remove('ok'));meta.classList.remove('bien');k++;
      if(k>=metas.length){fin({});return;}f=relleno([],F);dibujar();}
    else if(v>T){meta.classList.remove('sacude');void meta.offsetWidth;meta.classList.add('sacude');}}
  dibujar();}

function malezaSVG(p,estado){

const ARREGLO_LV=[
  {start:[{b:0,d:2}],T:21,par:1},{start:[{b:0,d:4},{b:0,d:1}],T:100,par:2},{start:[{b:1,d:3},{b:1,d:3}],T:130,par:2},{start:[{b:3,d:4},{b:0,d:1}],T:1,par:2},

  {start:[{b:0,d:4},{b:3,d:1}],T:20,par:3},{start:[{b:3,d:3},{b:0,d:0},{b:0,d:2}],T:400,par:3},{start:[{b:3,d:4},{b:1,d:0}],T:100,par:3},{start:[{b:1,d:4},{b:3,d:0}],T:100,par:3},
  {start:[{b:0,d:3},{b:3,d:0},{b:0,d:2}],T:400,par:3}];

  let s=level*7919+13;const r=()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648;};

  const settle=f=>{let ev=0;for(;;){let k=-1;for(let i=0;i<f.length;i++)if(f[i][0]>=5||f[i][1]>=4){k=i;break;}if(k<0)return ev;
    if(f[k][0]>=5){f[k][0]-=5;f[k][1]++;}else{f[k][1]-=4;if(k+1>=f.length)return -1;f[k+1][0]++;}ev++;}};
  for(let tries=0;tries<600;tries++){
    const start=[...Array(F)].map((_,i)=>i<F-1||r()<0.3?[Math.floor(r()*5),Math.floor(r()*4)]:[0,0]);

      for(let i=0;i<F;i++)for(let t=0;t<2;t++){if(f[i][t]===0)continue;for(let j=0;j<F;j++){if(j===i)continue;const g=f.map(x=>x.slice());g[i][t]--;g[j][t]++;const e=settle(g);if(e<0)continue;go(g,d+1,ev+e);}}})(start,0,0);
    const c=[...at].filter(([v,e])=>e.c===1&&!shorter.has(v)&&v!==v0&&e.ev>=1);if(!c.length)continue;
    const strong=c.filter(([v,e])=>e.ev>=2);const pool=strong.length&&r()<0.7?strong:c;const [T]=pool[Math.floor(r()*pool.length)];
    return{start:start.map(x=>({d:x[0],b:x[1]})),T,par,F};}

function nivelArreglo(n){if(n<ARREGLO_LV.length){const L=ARREGLO_LV[n];return{...L,F:3};}let lv=n-ARREGLO_LV.length+5,L=genArreglo(lv);while(!L){lv++;L=genArreglo(lv);}return L;}

/* ====================================================================================================
   tocar el mundo: una parcela, la troje; pellizcar = volver
   ==================================================================================================== */
/* en el monte: pellizcar acerca y aleja (zoom continuo) y un dedo recorre; en la parcela, pellizcar = volver */
const ptrs=new Map();let pinchD=0,pinchHecho=false,zoomIni=null,panIni=null;
const monteW=()=>Math.min(W,H*appW/appH);

function acotarCam(){const w=cam.w,alto=Math.min(H,w*appH/appW);cam.cx=Math.max(w/2,Math.min(W-w/2,cam.cx));cam.cy=Math.max(alto*cam.fy,Math.min(H-alto*(1-cam.fy),cam.cy));}

function zoomA(w,sx,sy,m){const r=app.getBoundingClientRect();cam.w=Math.max(34,Math.min(monteW(),w));const alto=Math.min(H,cam.w*appH/appW);
  const x0=m.x-(sx-r.left)*cam.w/appW,y0=m.y-(sy-r.top)*alto/appH;cam.cx=x0+cam.w/2;cam.cy=y0+alto*cam.fy;acotarCam();

function empezarPan(){const p=[...ptrs.values()][0];panIni=p?{x:p.x,y:p.y,cx:cam.cx,cy:cam.cy}:null;}
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t0:performance.now()});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y);pinchHecho=false;panIni=null;
    if(libreMonte())zoomIni={d:pinchD,w:cam.w,m:mundoEn((a.x+b.x)/2,(a.y+b.y)/2)};}
  else if(ptrs.size===1&&libreMonte())empezarPan();});

    if(zoomIni&&pant.tipo==='monte'){if(dd>0)zoomA(zoomIni.w*zoomIni.d/dd,(a.x+b.x)/2,(a.y+b.y)/2,zoomIni.m);pinchHecho=true;return;}
    if(!pinchHecho&&pinchD>0&&dd<pinchD*.72){pinchHecho=true;atras();}}
  else if(ptrs.size===1&&panIni&&pant.tipo==='monte'&&cam.w<monteW()-.5){const dx=e.clientX-panIni.x,dy=e.clientY-panIni.y;
    if(p.arrastra||Math.hypot(dx,dy)>8){p.arrastra=true;cam.cx=panIni.cx-dx*cam.w/appW;cam.cy=panIni.cy-dy*cam.w/appW;acotarCam();}}});

  if(pant.tipo==='monte'){if(s===TROJE){if(est.visto.monte)ir('troje');return;}if(hay)ir('parcela',{pos});}
  else if(pant.tipo==='parcela'){if(!est.visto.monte)return;if(s===TROJE){ir('troje');return;}if(pos===pant.d.pos){atras();return;}if(hay)ir('parcela',{pos});}   /* tocar otra vez la misma parcela = alejarse */
  else if(pant.tipo==='troje'){if(s===TROJE)atras();}   /* tocar otra vez la troje = alejarse */
  else if(pant.tipo==='semilla'){if(elegida!==null&&est.parcelas[pos]){MilpaMotor.elegirSemilla(D,est,elegida,[pos]);guardar();}}}
window.addEventListener('keydown',e=>{if(e.key==='Escape')atras();});
function mantener(el,fn){let t=null;el.addEventListener('pointerdown',()=>{t=setTimeout(()=>{t=null;fn();},700);});const no=()=>{if(t){clearTimeout(t);t=null;}};el.addEventListener('pointerup',no);el.addEventListener('pointerleave',no);el.addEventListener('pointercancel',no);el.addEventListener('contextmenu',e=>e.preventDefault());}

/* ====================================================================================================
   el panel del prototipo (no es parte del juego): reloj, adelantar el tiempo, empezar de cero
   ==================================================================================================== */
let devEl=null;
function cerrarDev(){if(devEl){devEl.remove();devEl=null;}}
function abrirDev(){cerrarDev();devEl=h('div','dev');app.append(devEl);let seguro=false;
  const pinta=()=>{const hv=horaJuego(),dia=Math.floor(MilpaMotor.horaDeJuego(est,Date.now())/24)+1,hh=Math.floor(hv),mm=Math.floor((hv-hh)*60);
    devEl.innerHTML=`<h2>Prototipo</h2><p>${NUBE.estado==='nube'?'Guardado en tu cuenta'+(NUBE.hora?' (hace '+Math.max(0,Math.round((Date.now()-NUBE.hora)/1000))+' s)':'')+' y en este navegador.':NUBE.estado==='conectando'?'Conectando con tu cuenta…':NUBE.estado.startsWith('error')?'No se pudo guardar en tu cuenta '+NUBE.estado.slice(5)+'; queda en este navegador.':'Guardado solo en este navegador.'}</p><p>Día ${dia} · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} · ${est.troje.mazorcas} mazorcas · ${Object.keys(est.parcelas).length} parcelas</p>
      <div class="fila"><button data-r="rapido" aria-pressed="${est.reloj.tipo==='rapido'}">Reloj rápido (1 día = 10 min)</button><button data-r="real" aria-pressed="${est.reloj.tipo==='real'}">Reloj real</button></div>
      <div class="fila"><button data-a="1">+1 h</button><button data-a="6">+6 h</button><button data-a="24">+1 día</button></div>
      <div class="fila"><button data-m="prueba" aria-pressed="${MODO==='prueba'}">Modo prueba de un día</button><button data-m="normal" aria-pressed="${MODO!=='prueba'}">Ritmo normal</button></div>
      <p>${MODO==='prueba'?'Un día = 30 min, el cultivo tarda 8 h de juego, cada parcela nueva media hora y series de 3 o más juegos por siembra y por cosecha. Entra cada ~30 min.':'Los números de datos.json: un día = 10 min, cultivo de 24 h, series de 3 o más.'}</p>
      <div class="fila"><button data-s="1">Un suceso extraño</button><span style="align-self:center;color:var(--suave);font-size:13px">Vistos: ${Object.keys(SUCESOS_VISTOS).length} de ${Object.keys(SUCESOS).length}</span></div>
      <div class="fila"><button data-x="cero">${seguro?'¿Seguro? Toca otra vez':'Empezar de cero'}</button><button data-x="cerrar">Cerrar</button></div>`;};
  pinta();
  devEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();
    if(b.dataset.r){MilpaMotor.cambiarReloj(D,est,b.dataset.r,Date.now());guardar();pinta();}
    else if(b.dataset.a){est.reloj.horaBase+=+b.dataset.a;MilpaMotor.avanzar(D,est,Date.now());despues();if(actualizarCapa)actualizarCapa(true);pinta();}
    else if(b.dataset.s){if(pant.tipo!=='monte')ir('monte',{},{atras:true});lanzarSuceso(Object.keys(SUCESOS).filter(k=>{const hv=horaJuego(),n=hv<5.8||hv>=19.4;return n?SUCESOS[k].noche:SUCESOS[k].dia;})[Math.floor(Math.random()*4)]||null);cerrarDev();}
    else if(b.dataset.m){if(b.dataset.m!==MODO){ls.set('milpa.prototipo.modo',b.dataset.m);guardar();if(NUBE.timer){clearTimeout(NUBE.timer);NUBE.timer=null;}Promise.resolve(subirNube()).finally(()=>location.reload());}}
    else if(b.dataset.x==='cerrar')cerrarDev();
    else if(b.dataset.x==='cero'){if(!seguro){seguro=true;pinta();return;}reiniciarTodo();}});}

/* ====================================================================================================
   el bucle: el motor avanza cada segundo; el mundo se pinta a su ritmo; la cámara y las capas, cada cuadro
   ==================================================================================================== */
let ultimaPint=-1e9,costo=14,ultimoTic=0,ultimoGuardado=Date.now(),filtroPrev='',aBordes=0;
/* los sucesos extraños: raros, solo cuando estás mirando (el monte o una parcela); de noche o de día según la hora del juego */
let proxSuceso=performance.now()+30000+Math.random()*30000,sucesoActual=null;
let SUCESOS_VISTOS={};try{SUCESOS_VISTOS=JSON.parse(ls.get('milpa.prototipo.sucesos')||'{}');}catch(e){SUCESOS_VISTOS={};}
function lanzarSuceso(tipo){const hv=horaJuego(),noche=hv<5.8||hv>=19.4,ops=Object.keys(SUCESOS).filter(k=>noche?SUCESOS[k].noche:SUCESOS[k].dia);
  if(!tipo){if(!ops.length)return false;const nuevos=ops.filter(k=>!SUCESOS_VISTOS[k]);const bolsa=nuevos.length&&Math.random()<.7?nuevos:ops;tipo=bolsa[Math.floor(Math.random()*bolsa.length)];}
  const t0=performance.now()/1000;SUCESO={tipo,t0,dur:SUCESOS[tipo].dur,r:(Math.random()*2147483646|0)+1};if(tipo==='chupacabras')EVENTO={t0};
  sucesoActual=tipo;forzarPintar=true;return true;}
function revisarSucesos(){const ahora=performance.now();
  if(sucesoActual&&!SUCESO&&!EVENTO){if(!SUCESOS_VISTOS[sucesoActual]){SUCESOS_VISTOS[sucesoActual]=Date.now();ls.set('milpa.prototipo.sucesos',JSON.stringify(SUCESOS_VISTOS));}sucesoActual=null;proxSuceso=ahora+45000+Math.random()*60000;}
  if(!SUCESO&&!EVENTO&&!sucesoActual&&ahora>proxSuceso&&(pant.tipo==='monte'||pant.tipo==='parcela')&&!document.hidden){if(!lanzarSuceso())proxSuceso=ahora+20000;}}
let forzarPintar=false;
/* el reloj: una carátula de 24 h en píxel y la hora en números */
let relojClave='';
function pintarReloj(){const el=document.getElementById('reloj');if(!el)return;
  const total=MilpaMotor.horaDeJuego(est,Date.now()),h=((total%24)+24)%24,dia=Math.floor(total/24)+1,hh=Math.floor(h),mm=Math.floor((h-hh)*60);
  const clave=hh+':'+Math.floor(mm/5)+'|'+dia;if(clave===relojClave)return;relojClave=clave;
  const pos=(hr,r)=>{const a=(hr-12)/24*Math.PI*2;return[12+Math.sin(a)*r,12-Math.cos(a)*r];};
  const px=(x,y,c,s=2)=>`<rect x="${(x-s/2).toFixed(1)}" y="${(y-s/2).toFixed(1)}" width="${s}" height="${s}" fill="${c}"/>`;
  let s='';for(let k=0;k<48;k++){const [x,y]=pos(k/2,10);s+=px(x,y,'#FFFFFF',1.6);}            /* el aro */
  for(const hr of D.lluvia.horas){const [x,y]=pos(hr,7.4);s+=px(x,y,'#5AA8EA',2.2);}         /* las horas de la lluvia */
  {const [x,y]=pos(0,7.4);s+=px(x,y,'#FFFFFF',1.6);}                                          /* medianoche, abajo */
  for(let k=1;k<=5;k++){const [x,y]=pos(h,k*1.15);s+=px(x,y,'#FFFFFF',1.8);}                 /* la manecilla */
  const dia_=h>=6&&h<19,[sx,sy]=pos(h,7.4);s+=px(sx,sy,dia_?'#F2C230':'#E8ECF5',4);           /* sol o luna en la punta */
  el.innerHTML=`<svg viewBox="0 0 24 24">${s}</svg><span>${hh}:${String(mm).padStart(2,'0')}<span class="dia">día ${dia}</span></span>`;}
function tic(){const ahora=Date.now();MilpaMotor.avanzar(D,est,ahora);revisarSucesos();pintarReloj();
  if(firmaMundo()!==firmaG){if(camTr)regenPendiente=true;else regenerar();}
  revisarBordes();
  if(actualizarCapa)actualizarCapa(false);
  if(ahora-ultimoGuardado>5000){guardarLocal();ultimoGuardado=ahora;}}
function bucle(ms){
  const t=ms/1000;
  if(camTr){const p=cl((ms-camTr.t0)/camTr.dur),e=QUIETO?(p<.5?0:1):camTr.ease(p);for(const k in camTr.a)cam[k]=camTr.de[k]+(camTr.a[k]-camTr.de[k])*e;if(p>=1)camTr=null;}
  if(ms-ultimoTic>1000){ultimoTic=ms;tic();}
  if(regenPendiente&&!camTr){regenPendiente=false;regenerar();revisarBordes();}
  const hv=horaJuego();aplicarTema(hv);asegurarS(hv);
  const quieto=(pant.tipo==='juego'||pant.tipo==='seccion')&&!camTr;
  if(ms-ultimaPint>(quieto?500:Math.max(66,costo*3.5))||flashActivo(t)){prepararS(t);const a0=performance.now();pintar(OFF,G,S,t,hv);costo=costo*.8+(performance.now()-a0)*.2;ultimaPint=ms;}
  const v=vistaDe(cam);
  ctx.imageSmoothingEnabled=false;ctx.drawImage(OFF,v.x,v.y,v.w,v.h,0,0,cv.width,cv.height);
  const objetivo=camTr?0:pant.tipo==='monte'?.5+.45*(.5+.5*Math.sin(t*3)):pant.tipo==='parcela'?.25+.25*(.5+.5*Math.sin(t*3)):0;
  aBordes+=(objetivo-aBordes)*(camTr?.25:.35);
  if(bordes&&aBordes>.02){ctx.globalAlpha=aBordes;ctx.drawImage(bordes,v.x,v.y,v.w,v.h,0,0,cv.width,cv.height);ctx.globalAlpha=1;}
  const f=(cam.bor>.1||cam.osc>.01)?`blur(${cam.bor.toFixed(1)}px) brightness(${(1-cam.osc).toFixed(2)})`:'none';if(f!==filtroPrev){cv.style.filter=f;filtroPrev=f;}
  actualizarMarcas(v);
  requestAnimationFrame(bucle);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){guardarLocal();subirNube();}else tic();});
window.addEventListener('pagehide',()=>{guardarLocal();subirNube();});
window.addEventListener('resize',()=>{medir();if(!camTr)Object.assign(cam,camDe(pant.tipo,pant.d));});

/* ====================================================================================================
   empezar: la primera vez, dentro de la parcela del norte, sembrando (sin menú de entrada)
   ==================================================================================================== */
regenerar();aplicarTema(horaJuego());asegurarS(horaJuego());revisarBordes();
if(est.contadores.cosechas===0)ir('parcela',{pos:D.mapa.orden[0]});
else{if(!est.visto.monte){MilpaMotor.marcarVisto(est,'monte');guardar();}ir('monte');}
if(window.MilpaPrueba)MilpaPrueba.iniciar({app,est:()=>est,D,modo:MODO,pantalla:()=>pant.tipo,horaDeJuego:()=>MilpaMotor.horaDeJuego(est,Date.now()),
  aprendizaje:()=>MilpaMotor.aprendizaje(D,est),sucesos:()=>({vistos:Object.keys(SUCESOS_VISTOS).length,total:Object.keys(SUCESOS).length})});
requestAnimationFrame(bucle);
carga.style.pointerEvents='none';setTimeout(()=>{carga.style.opacity='0';setTimeout(()=>carga.remove(),650);},60);   /* con temporizador: si la página carga en segundo plano, rAF no corre y la carga no debe quedarse encima */
window.MILPA_DEBUG={est:()=>est,D,ir,G:()=>G,cam,lanzarSuceso};
})();
/* iOS: que el pellizco sea "volver" y no un zoom de la página */
document.addEventListener('gesturestart',e=>e.preventDefault());
/* la página publicada se puede abrir sin conexión (sw.js); dentro del Artifact el registro falla y no pasa nada */
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
